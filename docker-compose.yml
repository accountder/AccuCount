services:
  accucount:
    build: .
    image: accucount:0.2.1
    container_name: accucount
    ports:
      - "8070:8090"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - ACCUCOUNT_DATA=/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
